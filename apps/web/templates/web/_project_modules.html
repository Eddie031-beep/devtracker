{# Sección «Gestión del proyecto» de la página del proyecto: un acceso por módulo (ver apps/web/modules.py). #}
{% if modules %}
<section class="no-print" aria-labelledby="modules-title">
  <h2 id="modules-title" class="tw-mb-3">Gestión del proyecto</h2>
  <div class="tw-grid tw-gap-3 sm:tw-grid-cols-2 xl:tw-grid-cols-4">
    {% for item in modules %}
    <a href="{{ item.url }}" class="dt-card tw-flex tw-flex-col tw-gap-1 tw-text-ink hover:tw-border-accent hover:tw-no-underline">
      <span class="dt-title">{{ item.module.label }}</span>
      <span class="tw-text-sm tw-text-muted">{{ item.module.description }}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endif %}
