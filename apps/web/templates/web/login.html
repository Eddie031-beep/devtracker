{% extends "web/base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<article style="max-width: 420px; margin: 3rem auto;">
  <hgroup>
    <h2>Iniciar sesión</h2>
    <p>Gestión y auditoría de proyectos de software</p>
  </hgroup>
  {% if form.errors %}
  <p class="overdue">Usuario o contraseña incorrectos.</p>
  {% endif %}
  <form method="post">{% csrf_token %}
    <label>Usuario
      <input type="text" name="username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
    </label>
    <label>Contraseña
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
</article>
{% endblock %}
