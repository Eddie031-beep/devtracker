{% extends "web/base.html" %}
{% block title %}Editar acta{% endblock %}
{% block content %}
{% include "web/_module_header.html" with title="Editar acta" subtitle=meeting.title %}
<form method="post" class="dt-card tw-max-w-3xl">{% csrf_token %}
  {% include "meetings/_meeting_fields.html" %}
  <div class="tw-flex tw-flex-wrap tw-gap-2">
    <button type="submit" class="btn">Guardar cambios</button>
    <a href="{% url 'meetings:detail' meeting.pk %}" class="btn secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
