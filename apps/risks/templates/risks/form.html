{% extends "web/base.html" %}
{% block title %}Editar {{ risk.code }}{% endblock %}
{% block content %}
{% include "web/_module_header.html" with title="Editar riesgo" subtitle=risk.title %}
<form method="post" class="dt-card tw-max-w-3xl">{% csrf_token %}
  {% include "risks/_risk_fields.html" %}
  <div class="tw-flex tw-flex-wrap tw-gap-2">
    <button type="submit" class="btn">Guardar cambios</button>
    <a href="{% url 'risks:detail' risk.pk %}" class="btn secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
