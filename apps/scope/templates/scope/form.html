{% extends "web/base.html" %}
{% block title %}Editar {{ change.code }}{% endblock %}
{% block content %}
{% include "web/_module_header.html" with title="Editar solicitud" subtitle=change.title %}
<form method="post" class="dt-card tw-max-w-3xl">{% csrf_token %}
  {% include "scope/_fields.html" %}
  <div class="tw-flex tw-flex-wrap tw-gap-2">
    <button type="submit" class="btn">Guardar cambios</button>
    <a href="{% url 'scope:detail' change.pk %}" class="btn secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
